# BlockDesign 2.0 — nginx server block
#
# Included by nginx-unprivileged inside its http{} block.
# Do NOT add worker_processes / events / http here.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080 default_server;
    server_name _;

    root /var/www/app;
    charset utf-8;

    # ---------------------------------------------------------------
    # AI assistant API proxy → Daily Assistant backend
    # ---------------------------------------------------------------
    location /assistant-api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
    }

    # ---------------------------------------------------------------
    # Penpot backend API + websocket proxy
    # ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://penpot-backend:6060/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/api/ {
        proxy_pass http://penpot-backend:6060/ws/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------
    # Penpot exporter proxy
    # ---------------------------------------------------------------
    location /export {
        proxy_pass http://penpot-exporter:6061;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------
    # Static assets with long cache
    # ---------------------------------------------------------------
    location ~* \.(js|css|wasm|woff2?|ttf|eot|svg|png|jpg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}

