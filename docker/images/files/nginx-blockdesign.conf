# BlockDesign 2.0 — nginx configuration
#
# This is a self-contained nginx config (not a template) for the
# ghcr.io/blockmakercompany/blockdesign-frontend image.
#
# It serves the compiled Penpot/BlockDesign frontend bundle and proxies
# the AI assistant API to the Daily Assistant backend.  No brand.js
# injection or plugin serving — the assistant is now native in the app.

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    error_log  /dev/stderr;
    access_log /dev/stdout;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_static on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/transit+json image/svg+xml
               application/wasm;

    proxy_connect_timeout 300s;
    proxy_send_timeout    310s;
    proxy_read_timeout    310s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080 default_server;
        server_name _;

        root /var/www/app;
        charset utf-8;

        # ---------------------------------------------------------------
        # AI assistant API proxy → Daily Assistant backend
        # Handles: POST /assistant-api/blockdesign-v2/assistant
        # ---------------------------------------------------------------
        location /assistant-api/ {
            proxy_pass http://backend:3001/api/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 310s;
            proxy_send_timeout 310s;
        }

        # ---------------------------------------------------------------
        # Penpot backend API proxy
        # ---------------------------------------------------------------
        location /api/ {
            proxy_pass http://penpot-backend:6060/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------
        # Penpot websocket proxy
        # ---------------------------------------------------------------
        location /ws/api/ {
            proxy_pass http://penpot-backend:6060/ws/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------
        # Penpot exporter proxy
        # ---------------------------------------------------------------
        location /export {
            proxy_pass http://penpot-exporter:6061;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------------------------------------------------------------
        # Static assets — long cache for versioned files
        # ---------------------------------------------------------------
        location ~* \.(js|css|wasm|woff2?|ttf|eot|svg|png|jpg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ---------------------------------------------------------------
        # SPA fallback — all unknown paths serve index.html
        # ---------------------------------------------------------------
        location / {
            try_files $uri /index.html;
        }
    }
}
